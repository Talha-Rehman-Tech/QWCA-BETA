<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="icapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F3876"/>
      <stop offset="100%" stop-color="#081E44"/>
    </linearGradient>
    <linearGradient id="icapGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C158"/>
      <stop offset="50%" stop-color="#C59B27"/>
      <stop offset="100%" stop-color="#9A7513"/>
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="120" cy="120" r="114" fill="url(#icapGrad)" stroke="url(#icapGold)" stroke-width="5"/>
  <circle cx="120" cy="120" r="98" fill="none" stroke="url(#icapGold)" stroke-width="2" stroke-dasharray="4,2"/>
  <circle cx="120" cy="120" r="82" fill="#0A2550" stroke="url(#icapGold)" stroke-width="3"/>

  <!-- Star and Crescent at top -->
  <path d="M 120 45 A 8 8 0 1 1 120 61 A 6.5 6.5 0 1 0 120 47 Z" fill="url(#icapGold)"/>
  <polygon points="127,51 129,55 133,55 130,57 131,61 127,58 123,61 124,57 121,55 125,55" fill="url(#icapGold)"/>

  <!-- Scales of Justice (Central Emblem) -->
  <line x1="120" y1="72" x2="120" y2="148" stroke="url(#icapGold)" stroke-width="4" stroke-linecap="round"/>
  <polygon points="120,67 114,75 126,75" fill="url(#icapGold)"/>
  <!-- Balance Beam -->
  <line x1="86" y1="88" x2="154" y2="88" stroke="url(#icapGold)" stroke-width="4" stroke-linecap="round"/>
  <!-- Left Pan -->
  <line x1="86" y1="88" x2="72" y2="114" stroke="url(#icapGold)" stroke-width="1.8"/>
  <line x1="86" y1="88" x2="100" y2="114" stroke="url(#icapGold)" stroke-width="1.8"/>
  <path d="M 68 114 Q 86 128 104 114 Z" fill="url(#icapGold)"/>
  <!-- Right Pan -->
  <line x1="154" y1="88" x2="140" y2="114" stroke="url(#icapGold)" stroke-width="1.8"/>
  <line x1="154" y1="88" x2="168" y2="114" stroke="url(#icapGold)" stroke-width="1.8"/>
  <path d="M 136 114 Q 154 128 172 114 Z" fill="url(#icapGold)"/>

  <!-- Open Accounting Ledger Book at base of scale -->
  <path d="M 96 142 Q 120 136 120 148 Q 120 136 144 142 L 142 164 Q 120 156 120 166 Q 120 156 98 164 Z" fill="url(#icapGold)"/>
  <line x1="120" y1="148" x2="120" y2="166" stroke="#0A2550" stroke-width="2"/>

  <!-- Laurel Wreath -->
  <path d="M 52 120 Q 50 165 95 186 Q 75 165 72 135 Z" fill="url(#icapGold)" opacity="0.85"/>
  <path d="M 188 120 Q 190 165 145 186 Q 165 165 168 135 Z" fill="url(#icapGold)" opacity="0.85"/>

  <!-- ICAP Acronym -->
  <text x="120" y="180" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="900" fill="url(#icapGold)" text-anchor="middle" letter-spacing="3">ICAP</text>
  <text x="120" y="194" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8" font-weight="700" fill="#E5C158" text-anchor="middle" letter-spacing="1.5">PAKISTAN · 1961</text>
</svg>
