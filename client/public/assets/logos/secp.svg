<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="secpBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003B7A"/>
      <stop offset="100%" stop-color="#002147"/>
    </linearGradient>
    <linearGradient id="secpGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C853"/>
      <stop offset="100%" stop-color="#008E3D"/>
    </linearGradient>
  </defs>

  <!-- Clean Corporate Circular Base -->
  <circle cx="120" cy="120" r="114" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4"/>
  <circle cx="120" cy="120" r="108" fill="#F8FAFC"/>

  <!-- SECP Dynamic Intertwined Crescents/Ribbons -->
  <!-- Left Blue Swirl -->
  <path d="M 64 126 C 64 78 102 54 136 54 C 114 68 96 90 96 122 C 96 150 114 168 132 178 C 92 174 64 156 64 126 Z" fill="url(#secpBlue)"/>
  
  <!-- Right Green Growth Arc -->
  <path d="M 176 114 C 176 162 138 186 104 186 C 126 172 144 150 144 118 C 144 90 126 72 108 62 C 148 66 176 84 176 114 Z" fill="url(#secpGreen)"/>

  <!-- Dynamic Center Pillar Dot -->
  <circle cx="120" cy="120" r="14" fill="url(#secpBlue)"/>
  <circle cx="120" cy="120" r="6" fill="#FFFFFF"/>

  <!-- Top Star -->
  <polygon points="120,38 123,45 130,45 125,49 127,56 120,52 113,56 115,49 110,45 117,45" fill="url(#secpGreen)"/>

  <!-- SECP Acronym Text -->
  <text x="120" y="168" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="900" fill="#002B5B" text-anchor="middle" letter-spacing="3">SECP</text>
  <text x="120" y="196" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="1">GOVERNMENT OF PAKISTAN</text>
</svg>
