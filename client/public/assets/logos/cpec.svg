<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="cpecGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="cpecRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="cpecGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <circle cx="120" cy="120" r="114" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4"/>
  <circle cx="120" cy="120" r="106" fill="#0F172A"/>

  <!-- Left Green Swoosh (Pakistan) -->
  <path d="M 60 114 C 60 70 94 54 120 54 C 104 68 92 88 92 114 C 92 144 112 166 138 174 C 96 172 60 148 60 114 Z" fill="url(#cpecGreen)"/>
  
  <!-- Right Red Swoosh (China) -->
  <path d="M 180 126 C 180 170 146 186 120 186 C 136 172 148 152 148 126 C 148 96 128 74 102 66 C 144 68 180 92 180 126 Z" fill="url(#cpecRed)"/>

  <!-- Pakistan Crescent & Star on left side -->
  <path d="M 88 94 A 8 8 0 1 1 88 110 A 6.5 6.5 0 1 0 88 95 Z" fill="#FFFFFF"/>
  <polygon points="96,99 97,102 101,102 98,104 99,107 96,105 93,107 94,104 91,102 95,102" fill="#FFFFFF"/>

  <!-- China 5 Stars on right side -->
  <!-- Large central star -->
  <polygon points="152,104 154,110 160,110 155,114 157,120 152,116 147,120 149,114 144,110 150,110" fill="url(#cpecGold)"/>
  <circle cx="164" cy="98" r="2.5" fill="url(#cpecGold)"/>
  <circle cx="168" cy="106" r="2.5" fill="url(#cpecGold)"/>
  <circle cx="168" cy="116" r="2.5" fill="url(#cpecGold)"/>
  <circle cx="164" cy="124" r="2.5" fill="url(#cpecGold)"/>

  <!-- Center Bridge Link -->
  <ellipse cx="120" cy="120" rx="14" ry="14" fill="#FFFFFF" stroke="url(#cpecGold)" stroke-width="2"/>
  <text x="120" y="125" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="900" fill="#0F172A" text-anchor="middle">走廊</text>

  <!-- CPEC Text Banner -->
  <rect x="66" y="184" width="108" height="22" rx="5" fill="url(#cpecGold)"/>
  <text x="120" y="199" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="900" fill="#0F172A" text-anchor="middle" letter-spacing="3">CPEC</text>
  <text x="120" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="7.5" font-weight="800" fill="url(#cpecGold)" text-anchor="middle" letter-spacing="1">CHINA-PAKISTAN ECONOMIC CORRIDOR</text>
</svg>
