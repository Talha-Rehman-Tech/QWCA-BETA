services:
  mongodb:
    image: mongo:latest
    container_name: qwca-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: qwca_database
    volumes:
      - qwca_mongo_data:/data/db
    networks:
      - qwca_network

  mongo-express:
    image: mongo-express:latest
    container_name: qwca-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongodb
    networks:
      - qwca_network

networks:
  qwca_network:
    driver: bridge

volumes:
  qwca_mongo_data:
    driver: local
